name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks; runs on main
# always finish so every merge gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node scripts/check-versions.mjs
      - run: npm run build
      - run: npm test
      - name: Verify publish contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm pack --dry-run -w @tailhub/client -w tailhub

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the release image
        run: docker build -t tailhub:ci .
      - name: Smoke-test the image without ESM auto-detection
        run: |
          docker run --rm --entrypoint node tailhub:ci --no-experimental-detect-module /app/cli.js --version
